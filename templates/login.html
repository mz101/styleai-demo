<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Style AI</title>
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><a href="" style="font-family: 'Georgia', 'Times New Roman', serif;font-size: 32px;letter-spacing: 16px;font-weight: 700;color: #c9a86a;margin: 0;/* color: inherit; */text-decoration: none;">&nbsp;STYLE AI</a></h1>
    <p>Please sign in to continue</p>
  </div>

  <div class="form-container">
    {% if error %}
      <div class="login-error-message">{{ error }}</div>
    {% endif %}
    
    <form method="post" class="login-form">
      <!-- Login Credentials -->
      <div class="login-form-group">
        <div class="login-step-header">
           <div class="step-title">Sign In</div>
        </div>
        
        <!-- Username Input -->
        <div class="upload-section">
          <div class="login-input-wrapper">
            <input type="text" id="username" name="username" class="login-input" required autofocus placeholder="Enter your username">
            <div class="login-input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="user" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
          </div>
        </div>
        
        <!-- Password Input -->
        <div class="upload-section">
          <div class="login-input-wrapper">
            <input type="password" id="password" name="password" class="login-input" required placeholder="Enter your password">
            <div class="login-input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="lock" class="lucide lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
          </div>
        </div>
      </div>
      
      <button type="submit" class="product-gallery-toggle login-submit-btn">
        <big>Sign In</big>
      </button>
    </form>
    
    <div class="login-version-info">
      {{ version }}
    </div>
  </div>
</div>

<script>
  // Lucide icons initialisieren
  lucide.createIcons();
</script>
</body>
</html>
